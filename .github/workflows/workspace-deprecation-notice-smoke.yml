name: Workspace Deprecation Notice Smoke Test

# No paths-ignore: this job (checkout + smoke test) takes only a few seconds,
# so filtering triggers isn't worth the risk of a path list drifting out of
# sync and silently skipping the test on a relevant change.
on:
  pull_request: {}

permissions:
  contents: read  # checkout only

concurrency:
  group: workspace-deprecation-notice-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  workspace-deprecation-notice-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run workspace deprecation notice smoke test
        run: bash tools/test/workspace-deprecation-notice-smoke.sh
